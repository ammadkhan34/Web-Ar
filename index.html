<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
    }

    .ar-prompt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      font-size: 24px;
      text-align: center;
    }

    .ar-prompt button {
      background-color: #00aaff;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    .ar-prompt button:hover {
      background-color: #0088cc;
    }
  </style>
</head>
<body>

  <!-- AR Prompt Overlay -->
  <div id="arPrompt" class="ar-prompt">
    <p>Tap the button to view the 3D model in AR for Lamb Ribs – only £48!</p>
    <p>Move your phone slowly to detect the surface faster.</p>
    <button onclick="startAR()">Launch AR</button>
  </div>

  <!-- 3D Model Viewer -->
  <model-viewer 
    id="modelViewer" 
    ar  
    ar-placement="floor"
    ar-modes="webxr quick-look"
    camera-controls  
    shadow-intensity="1"
    environment-image="neutral"
    style="width: 100%; height: 80vh;"
    disable-zoom="false"
    camera-target="0m 0.1m 0m"
    scale="0.01 0.01 0.01"
  >
  </model-viewer>

  <script>
    const modelViewer = document.getElementById('modelViewer');
function getModelNameFromURL() {
      const params = new URLSearchParams(window.location.search);
      const model = params.get('model');
      const allowedModels = ['cheeseplate.glb', 'sticky.glb'];
      if (model && allowedModels.includes(model)) {
        return model;
      }
      return null;
    }

  // Set model based on URL
  modelViewer.src = getModelNameFromURL();


    function startAR() {
      if (modelViewer.canActivateAR) {
        modelViewer.setAttribute('scale', '0.2 0.2 0.2');
        modelViewer.activateAR();
      }
      document.getElementById('arPrompt').style.display = 'none';
    }

  </script>

</body>
</html>
